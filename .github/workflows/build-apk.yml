name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner already has the Android SDK installed; just accept its licences
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OpenAirTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAirTV-apk
          path: OpenAirTV.apk

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: OpenAirTV.apk
          make_latest: true
